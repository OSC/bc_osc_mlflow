---
cluster:
  - "ascend"
  - "pitzer"
  - "cardinal"
form:
  - auto_accounts
  - global_job_type
  - global_enable_mem
  - global_num_cores
  - global_mem
  - bc_num_hours
  - pytorch_module
  - working_dir
  - global_enable_debug
  - global_default_values
attributes:
  global_job_type:
    hide_by_default: true
  pytorch_module:
    widget: 'select'
    options:
      - [
          '2.8.0'
        ]
  working_dir:
    widget: "path_selector"
    label: "Tracking URI directory"
    data-target-file-type: both # Valid values are: files, dirs, or both
    readonly: false
    help: "Select your notebook or project directory; defaults to $HOME"

